name: memory_companion
description: "The app that remembers for you what your brain can no longer remember"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  riverpod: ^3.4.2
  flutter_riverpod: ^3.0.2
  flutter_localization: ^0.4.1
  intl: ^0.20.3
  flutter_launcher_icons: ^0.14.4
  connectivity_plus: ^6.1.3
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.4.0
  google_sign_in: ^6.3.0
  uuid: ^4.0.0

  # --- Persistencia local (offline-first) ---
  # Drift es la fuente de verdad del gameplay. Ver docs/OFFLINE_FIRST.md
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/logo_mascota.png
  #   - images/a_dot_ham.jpeg
